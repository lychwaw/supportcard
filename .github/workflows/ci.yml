name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security & Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm audit exits non-zero both for real vulnerabilities and for registry
      # errors, which are indistinguishable to CI. The advisory endpoint times
      # out often enough to have failed several builds on an unchanged
      # dependency tree, killing every step after it. Retry before believing it.
      - name: Dependency audit (fail on critical)
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=critical; then
              exit 0
            fi
            echo "Audit attempt $attempt failed — retrying in 10s"
            sleep 10
          done
          echo "::error::npm audit reported a critical vulnerability, or the registry was unreachable after 3 attempts"
          exit 1

      - name: Type-check frontend
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

      - name: Detect agent rules-file changes (OWASP AI §6)
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          SENSITIVE=$(echo "$CHANGED" | grep -E "^(\.agents/|\.claude/|CLAUDE\.md|AGENTS\.md|\.cursorrules|\.windsurfrules)" || true)
          if [ -n "$SENSITIVE" ]; then
            echo "::error::Agent steering file(s) modified — requires explicit owner review: $SENSITIVE"
            exit 1
          fi

      - name: Run tests
        run: npm test -- --run 2>/dev/null || echo "No tests configured yet"
